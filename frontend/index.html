<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      CONCEPT: What is index.html doing here?
      ─────────────────────────────────────────
      In a React app, index.html is a near-empty shell.
      It has one job: provide the <div id="root"> that
      main.jsx will inject the entire React app into.

      Everything you see on screen — the form, the buttons,
      the steps — is generated by React in JavaScript.
      The HTML file itself is almost empty on purpose.

      The <script> tag at the bottom is added automatically
      by Vite when it builds your app. You don't write it.
    -->

    <!-- Favicon — the small icon shown in the browser tab -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Page title shown in the browser tab -->
    <title>Patient Intake — AI Triage App</title>

    <!-- Prevents mobile browsers from zooming in on form inputs -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  </head>
  <body>
    <!-- This single div is where React mounts the entire application -->
    <!-- main.jsx finds this div by its id="root" and takes control of it -->
    <div id="root"></div>

    <!-- Vite injects the compiled React app here automatically -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
